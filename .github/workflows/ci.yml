name: Dual-Platform CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web App (Vue 3 + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Web Application
        run: yarn build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrplayer-web-dist
          path: dist/
          retention-days: 14

  build-android:
    name: Build Android Native APK (Go + Gio)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: android/go.sum

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Install gogio tool
        run: go install gioui.org/cmd/gogio@latest

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          cd android
          gogio -target android \
            -appid com.lerd.vrplayer \
            -arch arm64 \
            -minsdk 24 \
            -targetsdk 34 \
            -o vrplayer.apk \
            ./cmd/vrplayer

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vrplayer-android-apk
          path: android/vrplayer.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Binary (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: android/go.sum

      - name: Install Linux Graphics Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev

      - name: Build Desktop Player
        run: |
          cd android
          CGO_CFLAGS="-I$(pwd)/include" go build -o vrplayer-linux-amd64 ./cmd/vrplayer

      - name: Upload Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: vrplayer-desktop-linux
          path: android/vrplayer-linux-amd64
          retention-days: 14
